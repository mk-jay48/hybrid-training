<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a1b"><link rel="manifest" href="manifest.webmanifest"><title>Hybrid Training</title><style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#ecf2ef;background:#0d1516}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}header{padding:22px 20px 14px;max-width:900px;margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:800;letter-spacing:-.6px;font-size:23px}.brand span{color:#a8e6b1}.muted{color:#98aaa6;font-size:13px}.shell{max-width:900px;margin:auto;padding:0 16px 110px}.tabs{display:flex;gap:5px;background:#1a2929;border-radius:14px;padding:5px;overflow:auto;margin:10px 0 20px}.tabs button{border:0;color:#aabcb8;background:transparent;border-radius:10px;padding:11px 13px;white-space:nowrap;flex:1}.tabs button.active{background:#a8e6b1;color:#10221a;font-weight:800}.card{background:#172425;border:1px solid #2b3d3d;border-radius:18px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.grid .card{margin:0}.kpi{font-size:27px;font-weight:800;margin:8px 0}.eyebrow{text-transform:uppercase;letter-spacing:1.4px;font-size:11px;color:#a8e6b1;font-weight:800}.sub{color:#aebdb8;font-size:14px;line-height:1.5}.btn{background:#a8e6b1;color:#10221a;border:0;border-radius:11px;padding:11px 15px;font-weight:800}.btn.secondary{background:#2b3d3d;color:#ecf2ef}.btn.danger{background:#5b292b;color:#fff}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.stack{display:flex;flex-wrap:wrap;gap:8px}.pill{border-radius:30px;background:#2a3c3b;padding:5px 9px;color:#cce0d8;font-size:12px}.exercise{border-top:1px solid #344342;padding:15px 0}.exercise:first-child{border:0}.setrow{display:grid;grid-template-columns:38px 1fr 1fr 48px;gap:8px;align-items:center;margin:8px 0}.setrow input{width:100%;min-width:0}.field,input,select,textarea{background:#0f1b1c;color:#edf4f0;border:1px solid #3b5150;border-radius:9px;padding:10px}input[type=checkbox]{width:20px;height:20px;accent-color:#a8e6b1}label{display:block;font-size:12px;color:#aebdb8;margin:12px 0 5px}h1{font-size:30px;letter-spacing:-1px;margin:5px 0 12px}h2{font-size:20px;margin:10px 0}h3{font-size:16px;margin:5px 0}p{line-height:1.55}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px 6px;text-align:left;border-bottom:1px solid #30403f}th{color:#a8e6b1}canvas{width:100%;height:180px}.notice{border-left:3px solid #a8e6b1;padding:10px 14px;background:#1c302b;border-radius:8px}.footer{color:#869c97;font-size:12px;padding:20px 0} @media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}.shell{padding-bottom:40px}} </style></head><body><header><div class="brand">HYBRID<span> / TRAIN</span></div><div class="muted">Strength × Endurance</div></header><main class="shell"><nav class="tabs" id="tabs"></nav><section id="app"></section></main><script>
const KEY='hybrid-train-v1';const today=()=>new Date().toISOString().slice(0,10);const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const races=[{name:'10-mile race',date:'2026-12-20',distance:10},{name:'Half marathon',date:'2027-01-15',distance:13.1}];
const plans=[{name:'Upper Strength',day:'Monday',type:'lift',items:[['Bench press',3,'4–6'],['Chest-supported row',3,'5–8'],['Incline dumbbell press',3,'6–8'],['Neutral-grip pulldown',3,'6–10'],['Lateral raise',2,'12–15'],['Cable triceps pressdown',2,'10–12']]},{name:'Lower Strength',day:'Tuesday',type:'lift',items:[['Trap-bar deadlift',3,'3–5'],['Leg press',3,'6–8'],['Seated hamstring curl',3,'8–10'],['Standing calf raise',3,'10–15'],['Pallof press',2,'10/side']]},{name:'Upper Hypertrophy',day:'Thursday',type:'lift',items:[['Incline dumbbell bench',3,'8–12'],['Seated cable row',3,'8–12'],['Machine chest press',2,'10–12'],['Lat pulldown',3,'10–12'],['Biceps curl',3,'10–15'],['Rope triceps extension',3,'10–15']]},{name:'Lower Maintenance',day:'Friday',type:'lift',items:[['Bulgarian split squat',2,'8/side'],['Romanian deadlift',2,'8–10'],['Leg extension',2,'10–12'],['Seated calf raise',2,'12–15'],['Dead bug',2,'10/side']]},{name:'Optional Arms + Core',day:'Saturday',type:'lift',items:[['Cable curl',3,'10–15'],['Triceps pressdown',3,'10–15'],['Hammer curl',2,'10–12'],['Reverse fly',2,'12–15'],['Side plank',2,'30–45 sec/side']]}];
const runSchedule=[{day:'Wednesday',type:'Easy',desc:'Conversational effort, RPE 3–4; optional 4–6 × 20 sec relaxed strides if recovered.'},{day:'Thursday',type:'Quality',desc:'Controlled tempo or intervals, RPE 6–7; always include warm-up and cool-down.'},{day:'Sunday',type:'Long',desc:'Mostly easy effort, RPE 3–4; walk breaks are fine.'}];
const progression=[['Nov 16–22',3,3,6,'Tempo: 2 × 8 min'],['Nov 23–29',3,3.5,7,'Tempo: 2 × 10 min'],['Nov 30–Dec 6',3.5,4,8,'Tempo: 3 × 8 min'],['Dec 7–13',3,3,9,'Tempo: 15–20 min'],['Dec 14–20',2,2,10,'Race week: short strides; race Sunday'],['Dec 21–27',2,0,4,'Recovery: easy only'],['Dec 28–Jan 3',3,3,8,'Tempo: 2 × 10 min'],['Jan 4–10',3,3,10,'Tempo: 15 min'],['Jan 11–17',2,2,13.1,'Race week: half marathon Friday']];
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{runs:[],lifts:[],customPlans:null,settings:{weightUnit:'lb'},tab:'Home'};let tab=state.tab||'Home';const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n||0).toFixed(1).replace(/\.0$/,'');const countDown=d=>Math.ceil((new Date(d+'T12:00:00')-new Date())/86400000);const milePace=(min,mi)=>mi>0?`${Math.floor(min/mi)}:${String(Math.round((min/mi%1)*60)).padStart(2,'0')}`:'—';const weekStart=d=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()-((x.getDay()+6)%7));return x.toISOString().slice(0,10)};const currentWeek=()=>{let w=weekStart(today());let start=new Date('2026-11-16T12:00:00');return Math.max(0,Math.min(8,Math.floor((new Date(w+'T12:00:00')-start)/604800000)))};
function nav(t){tab=t;state.tab=t;save();render()}function render(){document.getElementById('tabs').innerHTML=['Home','Train','Runs','Progress','Settings'].map(t=>`<button class="${tab===t?'active':''}" onclick="nav('${t}')">${t}</button>`).join('');document.getElementById('app').innerHTML=({Home:home,Train:train,Runs:runs,Progress:progress,Settings:settings})[tab]();if(tab==='Progress')drawChart();if(tab==='Train')showWorkout()}
function home(){let w=weekStart(today()),rr=state.runs.filter(r=>weekStart(r.date)===w),ll=state.lifts.filter(r=>weekStart(r.date)===w),i=currentWeek(),p=progression[i];return `<div class="eyebrow">Your training command center</div><h1>Build strength. Go the distance.</h1><div class="grid"><div class="card"><div class="muted">Weekly miles</div><div class="kpi">${fmt(rr.reduce((a,r)=>a+Number(r.distance),0))}</div><div class="muted">Target ~${fmt(p[1]+p[2]+p[3])} mi</div></div><div class="card"><div class="muted">Lift sessions</div><div class="kpi">${ll.length}/4</div><div class="muted">Optional 5th</div></div><div class="card"><div class="muted">10-mile race</div><div class="kpi">${Math.max(0,countDown(races[0].date))}</div><div class="muted">days remaining</div></div><div class="card"><div class="muted">Half marathon</div><div class="kpi">${Math.max(0,countDown(races[1].date))}</div><div class="muted">days remaining</div></div></div><div class="card"><div class="eyebrow">Week ${i+1} · ${p[0]}</div><h2>Running prescription</h2><div class="stack"><span class="pill">Easy ${p[1]} mi</span><span class="pill">Quality ${p[2]} mi</span><span class="pill">Long ${p[3]} mi</span></div><p class="sub">${p[4]}. Quality mileage includes warm-up and cool-down. Adjust for fatigue and current tolerance.</p><button class="btn" onclick="nav('Runs')">Log a run</button></div><div class="card"><h2>Weekly schedule</h2><table><tr><th>Day</th><th>Strength</th><th>Run</th></tr>${[['Mon','Upper Strength','—'],['Tue','Lower Strength','—'],['Wed','—','Easy'],['Thu','Upper Hypertrophy','Quality'],['Fri','Lower Maintenance','—'],['Sat','Optional arms/core','—'],['Sun','—','Long']].map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</table></div><div class="notice"><b>Race-aware strength:</b> Keep lower-body sets 1–3 reps shy of failure. During race weeks, reduce lower-body volume by ~50–70%, avoid heavy leg training in the final 3–4 days, and prioritize feeling fresh.</div>`}
function train(){let list=state.customPlans||plans;return `<div class="eyebrow">Strength training</div><h1>Lift log</h1><p class="sub">Four core sessions plus optional arms/core. Record actual reps and loads; use the previous workout as a guide.</p><label>Choose workout</label><select id="workout" onchange="showWorkout()">${list.map((p,i)=>`<option value="${i}">${p.day} · ${esc(p.name)}</option>`).join('')}</select><div id="workoutDetails"></div><div class="card"><h3>Recent strength sessions</h3>${state.lifts.slice().reverse().slice(0,8).map(x=>`<div class="exercise"><b>${esc(x.name)}</b> <span class="muted">${esc(x.date)} · ${x.sets.filter(s=>s.done).length} sets</span></div>`).join('')||'<p class="sub">No sessions logged yet.</p>'}</div>`}
function showWorkout(){let idx=Number(document.getElementById('workout').value),p=(state.customPlans||plans)[idx];document.getElementById('workoutDetails').innerHTML=`<div class="card"><div class="row"><h2>${esc(p.name)}</h2><span class="pill">${p.day}</span></div><label>Date</label><input type="date" id="liftdate" value="${today()}">${p.items.map((ex,j)=>{let prior=state.lifts.slice().reverse().flatMap(l=>l.sets).find(s=>s.exercise===ex[0]&&s.done);return `<div class="exercise"><div class="row"><h3>${esc(ex[0])}</h3><span class="pill">${ex[1]} × ${esc(ex[2])}</span></div><div class="muted">Previous: ${prior?`${prior.weight} ${state.settings.weightUnit} × ${prior.reps}`:'—'}</div>${Array.from({length:ex[1]},(_,k)=>`<div class="setrow"><span class="muted">${k+1}</span><input type="number" min="0" step="0.5" placeholder="${state.settings.weightUnit}" data-ex="${j}" data-set="${k}" data-kind="weight"><input type="number" min="0" placeholder="reps" data-ex="${j}" data-set="${k}" data-kind="reps"><input type="checkbox" aria-label="Set complete" data-ex="${j}" data-set="${k}" data-kind="done"></div>`).join('')}</div>`}).join('')}<label>Session notes</label><textarea id="liftnotes" rows="2" style="width:100%" placeholder="Energy, pain, modifications..."></textarea><p><button class="btn" onclick="saveLift()">Save strength session</button></p></div>`}
function saveLift(){let p=(state.customPlans||plans)[Number(document.getElementById('workout').value)],sets=[];p.items.forEach((ex,j)=>{for(let k=0;k<ex[1];k++){let get=kind=>document.querySelector(`[data-ex="${j}"][data-set="${k}"][data-kind="${kind}"]`);sets.push({exercise:ex[0],weight:Number(get('weight').value),reps:Number(get('reps').value),done:get('done').checked})}});if(!sets.some(s=>s.done)){alert('Mark at least one completed set.');return}state.lifts.push({date:document.getElementById('liftdate').value,name:p.name,sets,notes:document.getElementById('liftnotes').value});save();render();showWorkout();alert('Strength session saved!')}
function runs(){let i=currentWeek(),p=progression[i];return `<div class="eyebrow">Endurance training</div><h1>Run tracker</h1><div class="card"><h2>This week's runs</h2>${runSchedule.map((r,j)=>`<div class="exercise"><div class="row"><b>${r.day} · ${r.type}</b><span class="pill">${p[j===0?1:j===1?2:3]} mi</span></div><p class="sub">${r.desc}${j===1?' '+p[4]+'.':''}</p></div>`).join('')}</div><div class="card"><h2>Log a run</h2><form onsubmit="saveRun(event)"><label>Date</label><input type="date" name="date" value="${today()}" required><label>Type</label><select name="type"><option>Easy</option><option>Quality</option><option>Long</option><option>Race</option><option>Recovery</option></select><label>Distance (miles)</label><input type="number" name="distance" step="0.01" min="0.01" required><label>Duration (minutes, decimal)</label><input type="number" name="duration" step="0.01" min="0.01" required><label>Effort (RPE 1–10)</label><input type="number" name="rpe" min="1" max="10" value="4" required><label>Notes</label><textarea name="notes" rows="2" style="width:100%" placeholder="Route, splits, conditions, how you felt"></textarea><p><button class="btn">Save run</button></p></form></div><div class="card"><h2>Run history</h2>${state.runs.slice().reverse().map((r,i)=>`<div class="exercise row"><div><b>${esc(r.type)} · ${fmt(r.distance)} mi</b><div class="muted">${esc(r.date)} · ${milePace(r.duration,r.distance)}/mi · RPE ${r.rpe}</div><div class="sub">${esc(r.notes)}</div></div><button class="btn secondary" onclick="deleteRun(${state.runs.length-1-i})">Delete</button></div>`).join('')||'<p class="sub">Your run history will appear here.</p>'}</div>`}
function saveRun(e){e.preventDefault();let f=new FormData(e.target),r=Object.fromEntries(f.entries());r.distance=Number(r.distance);r.duration=Number(r.duration);r.rpe=Number(r.rpe);state.runs.push(r);save();render()}function deleteRun(i){if(confirm('Delete this run?')){state.runs.splice(i,1);save();render()}}
function progress(){let total=state.runs.reduce((s,r)=>s+r.distance,0),longest=Math.max(0,...state.runs.map(r=>r.distance)),sets=state.lifts.flatMap(l=>l.sets).filter(s=>s.done),volume=sets.reduce((s,r)=>s+r.weight*r.reps,0);return `<div class="eyebrow">Training analytics</div><h1>Progress</h1><div class="grid"><div class="card"><div class="muted">Total run miles</div><div class="kpi">${fmt(total)}</div></div><div class="card"><div class="muted">Longest logged run</div><div class="kpi">${fmt(longest)}</div></div><div class="card"><div class="muted">Completed sets</div><div class="kpi">${sets.length}</div></div><div class="card"><div class="muted">Total lift volume</div><div class="kpi">${Math.round(volume).toLocaleString()}</div><div class="muted">${state.settings.weightUnit} × reps</div></div></div><div class="card"><h2>Weekly running mileage</h2><canvas id="chart" width="760" height="210"></canvas></div><div class="card"><h2>Exercise bests</h2><table><tr><th>Exercise</th><th>Best load</th><th>Best estimated 1RM</th></tr>${Object.entries(sets.reduce((a,s)=>{let x=a[s.exercise]||{max:0,e1rm:0};x.max=Math.max(x.max,s.weight);x.e1rm=Math.max(x.e1rm,s.reps<=12?s.weight*(1+s.reps/30):0);a[s.exercise]=x;return a},{})).map(([n,v])=>`<tr><td>${esc(n)}</td><td>${fmt(v.max)} ${state.settings.weightUnit}</td><td>${fmt(v.e1rm)} ${state.settings.weightUnit}</td></tr>`).join('')||'<tr><td colspan="3">Log a workout to see strength trends.</td></tr>'}</table></div><div class="card"><h2>Race roadmap</h2><table><tr><th>Week</th><th>Easy</th><th>Quality</th><th>Long</th></tr>${progression.map((p,i)=>`<tr><td>${p[0]} ${i===currentWeek()?'●':''}</td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td></tr>`).join('')}</table></div>`}
function drawChart(){let c=document.getElementById('chart');if(!c)return;let ctx=c.getContext('2d'),w=c.width,h=c.height;ctx.clearRect(0,0,w,h);let vals=progression.map((p,i)=>{let start=new Date('2026-11-16T12:00:00');start.setDate(start.getDate()+7*i);let week=start.toISOString().slice(0,10);return state.runs.filter(r=>weekStart(r.date)===week).reduce((s,r)=>s+r.distance,0)}),max=Math.max(15,...vals)*1.15;ctx.font='14px system-ui';vals.forEach((v,i)=>{let bw=45,x=38+i*78,y=h-32-v/max*(h-65);ctx.fillStyle='#a8e6b1';ctx.fillRect(x,y,bw,h-32-y);ctx.fillStyle='#c3d5d0';ctx.fillText(fmt(v),x,y-7);ctx.fillStyle='#91aaa4';ctx.fillText('W'+(i+1),x+8,h-9)})}
function settings(){return `<div class="eyebrow">Your data</div><h1>Settings</h1><div class="card"><h2>Weight units</h2><select onchange="state.settings.weightUnit=this.value;save();render()"><option ${state.settings.weightUnit==='lb'?'selected':''}>lb</option><option ${state.settings.weightUnit==='kg'?'selected':''}>kg</option></select><p class="sub">Changing the unit label does not convert previously logged weights.</p></div><div class="card"><h2>Backup and restore</h2><p class="sub">Your data is saved in this browser on this device. Export backups regularly; clearing browser data or changing devices can erase local records.</p><div class="stack"><button class="btn" onclick="exportData()">Export JSON backup</button><label class="btn secondary" style="margin:0">Import backup<input type="file" accept="application/json" onchange="importData(event)" style="display:none"></label></div></div><div class="card"><h2>Training guidelines</h2><p class="sub">Start from your actual recent mileage, not the plan's targets if they are higher. Keep most miles easy; quality work is optional when fatigued. Avoid painful movements and reduce lifting load during race taper weeks. Race dates: December 20, 2026 and January 15, 2027.</p></div><div class="card"><h2>Data reset</h2><button class="btn danger" onclick="if(confirm('Erase all locally saved training data?')){localStorage.removeItem(KEY);location.reload()}">Erase local data</button></div>`}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='hybrid-training-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function importData(e){let f=e.target.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let obj=JSON.parse(reader.result);if(!Array.isArray(obj.runs)||!Array.isArray(obj.lifts))throw Error('Invalid backup');if(confirm('Replace current local training data with backup?')){state=obj;save();render()}}catch(err){alert('Could not import: '+err.message)}};reader.readAsText(f)}render();if(tab==='Train')showWorkout();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
